name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.10'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate Android project
        run: |
          chmod +x setup.sh
          ./setup.sh

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK and App Bundle
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Verify build output
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          aab=build/app/outputs/bundle/release/app-release.aab
          test -s "$apk"
          test -s "$aab"
          unzip -l "$apk" | grep -q 'AndroidManifest.xml'
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libapp.so'
          unzip -l "$apk" | grep -q 'assets/flutter_assets/assets/data/verses.json'
          unzip -l "$apk" | grep -q 'assets/flutter_assets/assets/audio/gentle-rain-and-stream.ogg'
          "$ANDROID_HOME"/build-tools/*/aapt2 version >/dev/null
          ls -lh "$apk" "$aab"

      - name: Upload APK and App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: gratideo-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true

